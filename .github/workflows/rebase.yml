name: Sync upstream and merge into latest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: latest

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/dannyvfilms/Yamtrack.git || true
          git fetch --prune upstream latest
          git fetch --prune origin

      # 1) Update upstream-sync to upstream/latest, but NEVER change workflows
      - name: Update upstream-sync branch
        run: |
          git checkout -B upstream-sync upstream/latest

          # Freeze workflows to avoid GitHub blocking workflow file pushes.
          # Prefer existing origin/upstream-sync workflows if present, otherwise fork's latest.
          if git show-ref --verify --quiet refs/remotes/origin/upstream-sync; then
            git checkout origin/upstream-sync -- .github/workflows || true
          else
            git checkout origin/latest -- .github/workflows || true
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream/latest (preserve workflows)"
          fi

          git push --force origin upstream-sync

      # 2) If there's already an open PR, do NOT touch the merge branch
      - name: Stop if merge PR already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --state open --head upstream-merge --base latest --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Merge PR already open (upstream-merge -> latest). Leaving it alone."
            exit 0
          fi

      # 3) Create upstream-merge from latest, merge upstream-sync, and keep workflows frozen
      - name: Create/refresh upstream-merge branch
        run: |
          git checkout latest
          git checkout -B upstream-merge

          set +e
          git merge --no-ff --no-edit upstream-sync
          code=$?
          set -e

          git checkout origin/upstream-sync -- .github/workflows || true

          git add -A
          if ! git diff --cached --quiet; then
            if [ "$code" -eq 0 ]; then
              git commit -m "Merge upstream/latest into latest"
            else
              git commit -m "CONFLICT: merge upstream/latest into latest"
            fi
          fi

          git push --force origin upstream-merge

          # Propagate merge result as success/failure
          if [ "$code" -ne 0 ]; then
            echo "Merge had conflicts; PR created for manual resolution."
          fi

      - name: Create/Update PR upstream-merge -> latest
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: latest
          branch: upstream-merge
          title: "Merge upstream/latest into latest"
          body: |
            Automated merge of `upstream/latest` into `latest`.

            Notes:
            - `upstream-sync` tracks upstream/latest, but `.github/workflows/` is frozen to avoid GitHub workflow-push restrictions.
            - If this PR contains conflicts, resolve them here and merge into `latest`.
          delete-branch: false
