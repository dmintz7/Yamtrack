name: Rebase latest onto upstream/latest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: latest

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/dannyvfilms/Yamtrack.git || true
          git fetch upstream latest

      - name: Rebase onto upstream/latest
        run: |
          git rebase upstream/latest

      - name: Create Pull Request (if needed)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: latest
          branch: upstream-rebase
          title: "Rebase latest onto upstream/latest"
          body: "Automated rebase of latest onto upstream/latest."
          commit-message: "Rebase latest onto upstream/latest"
          delete-branch: true