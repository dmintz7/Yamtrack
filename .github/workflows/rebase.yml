name: Sync upstream into latest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: latest

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git remote add upstream https://github.com/dannyvfilms/Yamtrack.git || true
          git fetch upstream latest
          git fetch origin

      - name: Check for differences
        id: diff_check
        run: |
          count=$(git rev-list --count origin/latest..upstream/latest)
          echo "diff_count=$count" >> $GITHUB_OUTPUT

      - name: Exit if no changes
        if: steps.diff_check.outputs.diff_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --head upstream-merge --base latest --json number --jq '.[].number' \
            | xargs -I{} gh pr close {} --comment "Closing: upstream is no longer ahead of latest." || true
          echo "No upstream changes. Exiting."
          exit 0

      - name: Close stale PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --head upstream-merge --base latest --json number --jq '.[].number' \
            | xargs -I{} gh pr close {} --comment "Superseded by newer upstream changes." || true
          git push origin --delete upstream-merge || true

      - name: Create merge branch
        run: |
          git checkout -B upstream-merge origin/latest
          set +e
          git merge --no-ff --no-edit upstream/latest
          code=$?
          set -e
          git rm -r --cached .github/workflows/ || true
          rm -rf .github/workflows/
          git checkout origin/latest -- .github/workflows
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$code" -eq 0 ]; then
              git commit -m "Merge upstream/latest into latest"
            else
              git commit -m "CONFLICT: merge upstream/latest into latest"
            fi
          fi
          git push --force origin upstream-merge

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base latest \
            --head upstream-merge \
            --title "Merge upstream/latest into latest" \
            --body "Automated merge of upstream/latest. Resolve conflicts here if present."
